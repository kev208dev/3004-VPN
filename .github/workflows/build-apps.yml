name: Build & Test 3004-VPN (Backend, Windows, macOS, Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies & run tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Run core CLI unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v

  desktop-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install & Build Windows NSIS Installer
        working-directory: desktop
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3004-VPN-Windows-Installer
          path: |
            desktop/release/*.exe

  desktop-macos:
    name: Build macOS App (.dmg / .zip)
    runs-on: macos-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install & Build macOS Bundle
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npm run build
          npx electron-builder --mac dmg zip -c.mac.identity=null --publish never
      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3004-VPN-macOS-App
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip

  mobile-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Analyze, Test & Build Release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --release
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3004-VPN-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    name: Publish Latest GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop-windows, desktop-macos, mobile-android]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Prepare standardized release assets
        run: |
          mkdir -p release-assets
          WIN_EXE="$(find dist-artifacts/3004-VPN-Windows-Installer -maxdepth 2 -name '*.exe' | head -n 1)"
          MAC_DMG="$(find dist-artifacts/3004-VPN-macOS-App -maxdepth 2 -name '*.dmg' | head -n 1)"
          AND_APK="$(find dist-artifacts/3004-VPN-Android-APK -maxdepth 2 -name '*.apk' | head -n 1)"
          [ -n "$WIN_EXE" ] && cp "$WIN_EXE" release-assets/3004-VPN-Setup-Windows.exe
          [ -n "$MAC_DMG" ] && cp "$MAC_DMG" release-assets/3004-VPN-macOS.dmg
          [ -n "$AND_APK" ] && cp "$AND_APK" release-assets/3004-VPN-Android.apk
          ls -lh release-assets
      - name: Update 'latest' Release with Direct Downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest release-assets/* \
            --title "3004 VPN (Latest Build)" \
            --notes "최신 자동 빌드 설치 파일입니다. (Windows .exe / macOS .dmg / Android .apk)" \
            --latest
