<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none">
  <defs>
    <radialGradient id="auroraHero" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#065F46" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#121216" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="btnGlow" cx="50%" cy="50%" r="50%">
